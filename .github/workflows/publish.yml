name: build-publish

on:
  push:
    branches: [main, master]
    # 只有改到"会影响镜像内容"的文件才触发重建；改 compose/Caddyfile/文档等不会浪费构建
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  # 每周一 03:00 UTC（北京时间周一 11:00）自动重建一次：
  # 若 Dockerfile 的 ARG DSH_VERSION=latest，则自动跟随官方最新版；否则等于每周空跑一遍（无副作用）
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 解析 DSH 版本（latest = 自动解析官方 npm 最新版，其他值 = 锁定该版本）
        id: version
        run: |
          ARGVER=$(sed -n 's/^ARG DSH_VERSION=//p' Dockerfile)
          if [ "$ARGVER" = "latest" ]; then
            VER=$(npm view @deepseek-ai/dsh version)
          else
            VER="$ARGVER"
          fi
          echo "dsh_version=$VER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 把解析出的确切版本传给构建（即使 ARG 写的是 latest，也按解析到的版本精确安装，保证可复现）
          build-args: |
            DSH_VERSION=${{ steps.version.outputs.dsh_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.version.outputs.dsh_version }}
          platforms: linux/amd64,linux/arm64
          # GitHub 缓存：改一次 Dockerfile 后再次构建秒级命中，不用每次全量重装
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 供应链证明：记录镜像由哪个仓库/提交构建、依赖清单（SBOM）
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
