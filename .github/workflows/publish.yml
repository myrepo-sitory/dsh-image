name: build-publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取 DSH 版本（Dockerfile 里的 ARG 是唯一事实来源）
        id: version
        run: |
          VER=$(sed -n 's/^ARG DSH_VERSION=//p' Dockerfile)
          echo "dsh_version=$VER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.version.outputs.dsh_version }}
          platforms: linux/amd64,linux/arm64
          # GitHub 缓存：改一次 Dockerfile 后再次构建秒级命中，不用每次全量重装
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 供应链证明：记录镜像由哪个仓库/提交构建、依赖清单（SBOM）
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
